<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly Tour Operator</title>
    <!-- CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* Soft background */
        }

        .error-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
            overflow: hidden;
        }

        /* --- Dancing Background Icons --- */
        .dancing-icons {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none; /* Let clicks pass through */
        }

        .dancing-icons i {
            position: absolute;
            color: var(--primary-color, #059669);
            opacity: 0.1;
            animation: danceFloat infinite alternate ease-in-out;
        }

        /* Unique positions and animation delays for each icon */
        .icon-1 { top: 15%; left: 10%; font-size: 5rem; animation-duration: 4s; }
        .icon-2 { top: 20%; right: 15%; font-size: 8rem; animation-duration: 6s; animation-delay: 1s; }
        .icon-3 { bottom: 20%; left: 20%; font-size: 6rem; animation-duration: 5s; animation-delay: 2s; }
        .icon-4 { bottom: 15%; right: 10%; font-size: 4rem; animation-duration: 4.5s; animation-delay: 0.5s; }
        .icon-5 { top: 50%; left: 5%; font-size: 3rem; animation-duration: 3.5s; animation-delay: 1.5s; }
        .icon-6 { top: 40%; right: 5%; font-size: 7rem; animation-duration: 5.5s; animation-delay: 2.5s; }

        @keyframes danceFloat {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-20px) rotate(15deg) scale(1.1); }
            100% { transform: translateY(20px) rotate(-10deg) scale(0.9); }
        }

        /* --- The Glassmorphism Card --- */
        .error-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(5, 150, 105, 0.15);
            border-radius: 2rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.08), 0 10px 15px rgba(5, 150, 105, 0.05);
            padding: 4rem;
            position: relative;
            z-index: 1;
            max-width: 650px;
            width: 100%;
        }

        /* 404 Integrated Compass Design */
        .error-code-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .error-digit {
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(5, 150, 105, 0.15);
            margin: 0;
            padding: 0;
        }

        .compass-container {
            position: relative;
            width: clamp(5rem, 13vw, 8rem);
            height: clamp(5rem, 13vw, 8rem);
            margin: 0 0.5rem;
        }

        .compass-ring {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 6px dashed rgba(5, 150, 105, 0.3);
            border-radius: 50%;
            animation: rotateSpin 15s linear infinite;
        }

        .compass-inner {
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 2px solid rgba(5, 150, 105, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            box-shadow: inset 0 0 15px rgba(5, 150, 105, 0.1);
        }

        .compass-inner i {
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--primary-color, #059669);
            animation: needleFloat 2.5s ease-in-out infinite alternate;
        }

        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 1rem;
        }

        .error-desc {
            font-size: 1.05rem;
            color: #64748b;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* Animations */
        @keyframes rotateSpin { 100% { transform: rotate(360deg); } }
        @keyframes needleFloat {
            0% { transform: translateY(-5px) rotate(-10deg); }
            100% { transform: translateY(5px) rotate(10deg); }
        }

        /* Button Wrapper */
        .btn-group-responsive {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        
        .btn-group-responsive .btn {
            white-space: nowrap;
        }

        /* --- Mobile Responsiveness (up to 576px) --- */
        @media (max-width: 576px) {
            .error-wrapper { padding: 1rem; }
            .error-card { padding: 2rem 1.5rem; border-radius: 1.5rem; }
            .error-digit { font-size: clamp(4.5rem, 15vw, 6rem); }
            .compass-container { width: clamp(4rem, 12vw, 5rem); height: clamp(4rem, 12vw, 5rem); margin: 0 0.25rem; }
            .compass-ring { border-width: 4px; }
            .compass-inner { top: 6px; left: 6px; right: 6px; bottom: 6px; }
            .compass-inner i { font-size: clamp(1.8rem, 5vw, 2.2rem); }
            .error-title { font-size: 1.5rem; }
            .error-desc { font-size: 0.95rem; margin-bottom: 2rem; }
            
            /* Stack buttons perfectly on small screens */
            .btn-group-responsive { flex-direction: column; gap: 0.75rem; }
            .btn-group-responsive .btn { width: 100% !important; margin-top: 0 !important; }
        }
    </style>
</head>
<body>

    <div class="error-wrapper text-center">
        
        <!-- Dancing Background Icons -->
        <div class="dancing-icons">
            <i class="fa-solid fa-plane-up icon-1"></i>
            <i class="fa-solid fa-earth-americas icon-2"></i>
            <i class="fa-solid fa-suitcase-rolling icon-3"></i>
            <i class="fa-solid fa-camera icon-4"></i>
            <i class="fa-solid fa-passport icon-5"></i>
            <i class="fa-solid fa-map-location-dot icon-6"></i>
        </div>

        <!-- Glassmorphism Card -->
        <div class="error-card" data-aos="zoom-in" data-aos-duration="1000">
            
            <div class="error-code-wrapper">
                <span class="error-digit">4</span>
                <div class="compass-container">
                    <div class="compass-ring"></div>
                    <div class="compass-inner">
                        <i class="fa-solid fa-location-arrow"></i>
                    </div>
                </div>
                <span class="error-digit">4</span>
            </div>

            <h2 class="error-title">Off the Beaten Path!</h2>
            <p class="error-desc">Looks like you've wandered into uncharted territory. The destination you are looking for has been moved, deleted, or never existed.</p>

            <div class="btn-group-responsive">
                <a href="index.html" class="btn custom-btn custom-btn-primary rounded-pill px-4 py-3 shadow-sm">
                    <i class="fa-solid fa-house-chimney me-2"></i> Back to Home
                </a>
                <button onclick="history.back()" class="btn custom-btn custom-btn-outlined rounded-pill px-4 py-3">
                    <i class="fa-solid fa-arrow-rotate-left me-2"></i> Go Back
                </button>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true });
    </script>
</body>
</html>
