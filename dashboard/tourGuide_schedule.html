<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: transparent;
            font-family: 'Inter', sans-serif;
            color: #334155;
            padding: 2rem;
            overflow-x: hidden;
        }
        .text-emerald { color: #059669 !important; }
        .text-emerald-dark { color: #064e3b !important; }
        .bg-emerald { background-color: #059669 !important; }
        .bg-emerald-light { background-color: rgba(5, 150, 105, 0.1) !important; }
        
        .card-glass {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(5, 150, 105, 0.1);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            padding: 2rem;
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }
        .card-glass-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(5, 150, 105, 0.1);
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.1), rgba(2, 44, 34, 0.05));
            border-left: 4px solid #059669;
            border-radius: 12px;
            padding: 1.5rem;
            height: 100%;
        }
        .stat-card h3 { color: #064e3b; font-weight: 800; font-size: 2.2rem; margin-bottom: 0; }
        .stat-card p { color: #059669; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; margin: 0; letter-spacing: 1px; }
        .stat-icon { font-size: 2.5rem; color: rgba(5, 150, 105, 0.2); position: absolute; right: 20px; bottom: 20px; }
        
        .badge-active { background: rgba(5, 150, 105, 0.1); color: #059669; }
        .badge-pending { background: rgba(245, 158, 11, 0.1); color: #d97706; }
        .badge-completed { background: rgba(100, 116, 139, 0.1); color: #64748b; }
        
        .tour-img { border-radius: 12px; object-fit: cover; width: 100%; height: 200px; }
        .tour-img-sm { border-radius: 12px; object-fit: cover; width: 100px; height: 100px; }
        
        .custom-btn custom-btn-primary { background: #059669; color: white; border-radius: 8px; font-weight: 600; transition: all 0.3s; }
        .custom-btn custom-btn-primary:hover { background: #064e3b; color: white; transform: translateY(-2px); }
        .custom-btn custom-btn-outlined { border: 2px solid #059669; color: #059669; border-radius: 8px; font-weight: 600; transition: all 0.3s; }
        .custom-btn custom-btn-outlined:hover { background: #059669; color: white; }
        
        /* Table Styles */
        .table-custom th { color: #064e3b; font-weight: 700; border-bottom: 2px solid rgba(5, 150, 105, 0.2); padding: 1rem; }
        .table-custom td { padding: 1rem; vertical-align: middle; border-bottom: 1px solid rgba(0,0,0,0.05); }
        
        /* Form Inputs */
        .form-control, .form-select { padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #e2e8f0; }
        .form-control:focus, .form-select:focus { border-color: #059669; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1); }
        
        @media (max-width: 576px) {
            body { padding: 1rem; }
            .card-glass { padding: 1.5rem; }
            .stat-card h3 { font-size: 1.8rem; }
            .tour-img-sm { width: 100%; height: 180px; margin-bottom: 1rem; }
            .d-flex.flex-sm-row { flex-direction: column !important; }
            .btn-action { width: 100%; margin-top: 10px; }
            .table-responsive { border: 0; }
        }
    </style>
</head>
<body>    <div class="card-glass">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-2 text-emerald-dark">My Schedule</h2>
                <p class="text-muted mb-0">Manage your calendar and set your availability.</p>
            </div>
            <button class="btn custom-btn custom-btn-primary"><i class="fas fa-plus me-1"></i> Block Time Off</button>
        </div>
    </div>

    <div class="card-glass">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold text-dark mb-0">November 2026</h4>
            <div class="btn-group">
                <button class="btn custom-btn custom-btn-outlined"><i class="fas fa-chevron-left"></i></button>
                <button class="btn custom-btn custom-btn-outlined fw-bold">Today</button>
                <button class="btn custom-btn custom-btn-outlined"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- Simulated Calendar List View -->
        <div class="timeline-container">
            <div class="d-flex gap-4 mb-4 pb-4 border-bottom">
                <div class="text-center" style="min-width: 80px;">
                    <div class="text-muted text-uppercase fw-bold small">Nov</div>
                    <div class="display-5 fw-bolder text-emerald-dark">15</div>
                    <div class="text-muted small">to 22</div>
                </div>
                <div class="flex-grow-1 p-3 rounded-4" style="background-color: rgba(5, 150, 105, 0.05); border-left: 4px solid #059669;">
                    <h5 class="fw-bold text-dark mb-1">Bali Cultural Heritage Tour</h5>
                    <p class="text-muted small mb-2"><i class="fas fa-clock me-1"></i> Full Day Assignment</p>
                    <div class="d-flex align-items-center gap-2">
                        <img src="../assets/images/img_26.webp" class="rounded-circle" width="30">
                        <img src="../assets/images/img_27.webp" class="rounded-circle" width="30" style="margin-left: -15px;">
                        <span class="small fw-bold text-muted ms-2">+10 Travelers</span>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-4 mb-4 pb-4 border-bottom opacity-50">
                <div class="text-center" style="min-width: 80px;">
                    <div class="text-muted text-uppercase fw-bold small">Nov</div>
                    <div class="display-5 fw-bolder text-dark">26</div>
                    <div class="text-muted small">to 29</div>
                </div>
                <div class="flex-grow-1 p-3 rounded-4" style="background-color: #f1f5f9; border-left: 4px solid #94a3b8;">
                    <h5 class="fw-bold text-dark mb-1">Blocked: Personal Time Off</h5>
                    <p class="text-muted small mb-0"><i class="fas fa-plane-slash me-1"></i> Unavailable for assignments</p>
                </div>
            </div>
            
            <div class="d-flex gap-4">
                <div class="text-center" style="min-width: 80px;">
                    <div class="text-muted text-uppercase fw-bold small">Dec</div>
                    <div class="display-5 fw-bolder text-emerald-dark">05</div>
                    <div class="text-muted small">to 15</div>
                </div>
                <div class="flex-grow-1 p-3 rounded-4" style="background-color: rgba(245, 158, 11, 0.05); border-left: 4px solid #f59e0b;">
                    <h5 class="fw-bold text-dark mb-1">Swiss Alps Expedition</h5>
                    <p class="text-muted small mb-2"><i class="fas fa-clock me-1"></i> Full Day Assignment</p>
                    <div class="badge bg-warning text-dark px-3 py-1 rounded-pill">Upcoming</div>
                </div>
            </div>
        </div>
    </div>    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
</body>
</html>
