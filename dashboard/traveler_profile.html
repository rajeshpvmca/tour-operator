<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: transparent;
            font-family: 'Inter', sans-serif;
            color: #334155;
            padding: 2rem;
            overflow-x: hidden;
        }
        .text-emerald { color: #059669 !important; }
        .text-emerald-dark { color: #064e3b !important; }
        .bg-emerald { background-color: #059669 !important; }
        .bg-emerald-light { background-color: rgba(5, 150, 105, 0.1) !important; }
        
        .card-glass {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(5, 150, 105, 0.1);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            padding: 2rem;
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }
        .card-glass-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(5, 150, 105, 0.1);
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.1), rgba(2, 44, 34, 0.05));
            border-left: 4px solid #059669;
            border-radius: 12px;
            padding: 1.5rem;
            height: 100%;
        }
        .stat-card h3 { color: #064e3b; font-weight: 800; font-size: 2.2rem; margin-bottom: 0; }
        .stat-card p { color: #059669; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; margin: 0; letter-spacing: 1px; }
        .stat-icon { font-size: 2.5rem; color: rgba(5, 150, 105, 0.2); position: absolute; right: 20px; bottom: 20px; }
        
        .badge-upcoming { background: rgba(5, 150, 105, 0.1); color: #059669; }
        .badge-completed { background: rgba(100, 116, 139, 0.1); color: #64748b; }
        
        .tour-img { border-radius: 12px; object-fit: cover; width: 100%; height: 200px; }
        .tour-img-sm { border-radius: 12px; object-fit: cover; width: 100px; height: 100px; }
        
        .custom-btn custom-btn-primary { background: #059669; color: white; border-radius: 8px; font-weight: 600; transition: all 0.3s; }
        .custom-btn custom-btn-primary:hover { background: #064e3b; color: white; transform: translateY(-2px); }
        .custom-btn custom-btn-outlined { border: 2px solid #059669; color: #059669; border-radius: 8px; font-weight: 600; transition: all 0.3s; }
        .custom-btn custom-btn-outlined:hover { background: #059669; color: white; }
        
        /* Form Inputs */
        .form-control { padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #e2e8f0; }
        .form-control:focus { border-color: #059669; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1); }
        
        @media (max-width: 576px) {
            body { padding: 1rem; }
            .card-glass { padding: 1.5rem; }
            .stat-card h3 { font-size: 1.8rem; }
            .tour-img-sm { width: 100%; height: 180px; margin-bottom: 1rem; }
            .d-flex.flex-sm-row { flex-direction: column !important; }
            .btn-action { width: 100%; margin-top: 10px; }
        }
    </style>
</head>
<body>    <div class="card-glass">
        <h2 class="fw-bold mb-2 text-emerald-dark">Profile Settings</h2>
        <p class="text-muted mb-0">Manage your personal information, passport details, and preferences.</p>
    </div>

    <div class="row g-4">
        <div class="col-12 col-xl-4">
            <div class="card-glass text-center">
                <div class="position-relative d-inline-block mb-3">
                    <img src="../assets/images/img_35.webp" alt="Avatar" class="rounded-circle shadow" style="width: 150px; height: 150px; object-fit: cover; border: 4px solid white;">
                    <button class="btn custom-btn custom-btn-primary rounded-circle position-absolute bottom-0 end-0" style="width: 40px; height: 40px;"><i class="fas fa-camera"></i></button>
                </div>
                <h4 class="fw-bold text-dark mb-1">Sarah Jenkins</h4>
                <p class="text-muted mb-3">sarah.j@example.com</p>
                <div class="bg-emerald-light text-emerald px-3 py-2 rounded-3 fw-bold d-inline-block mb-4">
                    <i class="fas fa-award me-1"></i> Gold Explorer Tier
                </div>
            </div>
        </div>
        <div class="col-12 col-xl-8">
            <div class="card-glass">
                <h5 class="fw-bold text-emerald-dark mb-4">Personal Information</h5>
                <form>
                    <div class="row g-3 mb-4">
                        <div class="col-12 col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">First Name</label>
                            <input type="text" class="form-control" value="Sarah">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Last Name</label>
                            <input type="text" class="form-control" value="Jenkins">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
                            <input type="email" class="form-control" value="sarah.j@example.com" readonly>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Phone Number</label>
                            <input type="tel" class="form-control" value="+1 234 567 8900">
                        </div>
                    </div>

                    <h5 class="fw-bold text-emerald-dark mb-4 mt-5 border-top pt-4">Passport Details</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-12 col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Passport Number</label>
                            <input type="text" class="form-control" value="A12345678" type="password">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Nationality</label>
                            <select class="form-select form-control">
                                <option>United States</option>
                                <option>United Kingdom</option>
                                <option>Canada</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="text-end mt-4">
                        <button type="button" class="btn custom-btn custom-btn-primary px-4 py-2">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
</body>
</html>
