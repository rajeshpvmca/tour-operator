<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Tours</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: transparent;
            font-family: 'Inter', sans-serif;
            color: #334155;
            padding: 2rem;
            overflow-x: hidden;
        }
        .text-emerald { color: #059669 !important; }
        .text-emerald-dark { color: #064e3b !important; }
        .bg-emerald { background-color: #059669 !important; }
        .bg-emerald-light { background-color: rgba(5, 150, 105, 0.1) !important; }
        
        .card-glass {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(5, 150, 105, 0.1);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            padding: 2rem;
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }
        .card-glass-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(5, 150, 105, 0.1);
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.1), rgba(2, 44, 34, 0.05));
            border-left: 4px solid #059669;
            border-radius: 12px;
            padding: 1.5rem;
            height: 100%;
            position: relative;
        }
        .stat-card h3 { color: #064e3b; font-weight: 800; font-size: 2.2rem; margin-bottom: 0; }
        .stat-card p { color: #059669; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; margin: 0; letter-spacing: 1px; }
        .stat-icon { font-size: 2.5rem; color: rgba(5, 150, 105, 0.2); position: absolute; right: 20px; bottom: 20px; }
        
        .badge-active { background: rgba(5, 150, 105, 0.1); color: #059669; }
        .badge-pending { background: rgba(245, 158, 11, 0.1); color: #d97706; }
        .badge-error { background: rgba(239, 68, 68, 0.1); color: #dc2626; }
        .badge-neutral { background: rgba(100, 116, 139, 0.1); color: #64748b; }
        
        .custom-btn custom-btn-primary { background: #059669; color: white; border-radius: 8px; font-weight: 600; transition: all 0.3s; border: none; }
        .custom-btn custom-btn-primary:hover { background: #064e3b; color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(5,150,105,0.3); }
        .custom-btn custom-btn-outlined { border: 2px solid #059669; color: #059669; background: transparent; border-radius: 8px; font-weight: 600; transition: all 0.3s; }
        .custom-btn custom-btn-outlined:hover { background: #059669; color: white; }
        
        /* Table Styles */
        .table-custom th { color: #064e3b; font-weight: 700; border-bottom: 2px solid rgba(5, 150, 105, 0.2); padding: 1rem; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
        .table-custom td { padding: 1rem; vertical-align: middle; border-bottom: 1px solid rgba(0,0,0,0.05); }
        
        /* Form Inputs & Switches */
        .form-control, .form-select { padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #e2e8f0; }
        .form-control:focus, .form-select:focus { border-color: #059669; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1); }
        .form-check-input:checked { background-color: #059669; border-color: #059669; }
        
        @media (max-width: 576px) {
            body { padding: 1rem; }
            .card-glass { padding: 1.25rem; }
            .stat-card h3 { font-size: 1.8rem; }
            .table-responsive { border: 0; }
            .mobile-stack { flex-direction: column !important; align-items: stretch !important; }
            .mobile-stack .btn { width: 100%; margin-top: 10px; }
        }
    </style>
</head>
<body>    <div class="card-glass d-flex justify-content-between align-items-center mobile-stack">
        <div>
            <h2 class="fw-bold mb-2 text-emerald-dark">Tour Management</h2>
            <p class="text-muted mb-0">Create, monitor, and configure active platform tours.</p>
        </div>
        <button class="btn custom-btn custom-btn-primary px-4 py-2"><i class="fas fa-plus me-2"></i>Create New Tour</button>
    </div>

    <div class="card-glass">
        <div class="d-flex justify-content-between align-items-center mb-4 mobile-stack gap-3">
            <div class="position-relative w-100" style="max-width: 300px;">
                <i class="fas fa-search position-absolute text-muted" style="left: 15px; top: 50%; transform: translateY(-50%);"></i>
                <input type="text" class="form-control ps-5" placeholder="Search tours...">
            </div>
            <div class="d-flex gap-2">
                <select class="form-select w-auto"><option>All Status</option><option>Active</option><option>Draft</option></select>
                <select class="form-select w-auto"><option>All Regions</option><option>Europe</option><option>Asia</option></select>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-custom table-hover align-middle">
                <thead>
                    <tr>
                        <th>Tour Package</th>
                        <th>Region</th>
                        <th>Price</th>
                        <th>Duration</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <img src="../assets/images/img_23.webp" class="rounded-3" width="45" height="45" style="object-fit: cover;">
                                <div>
                                    <h6 class="fw-bold mb-0 text-dark">Bali Cultural Heritage</h6>
                                    <small class="text-muted">ID: TR-8992</small>
                                </div>
                            </div>
                        </td>
                        <td><span class="text-dark fw-medium">Asia</span></td>
                        <td><span class="text-emerald fw-bold">$1,200</span></td>
                        <td>7 Days</td>
                        <td><span class="badge badge-active rounded-pill px-3">Active</span></td>
                        <td class="text-end">
                            <button class="btn btn-sm custom-btn custom-btn-outlined text-primary me-1"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm custom-btn custom-btn-outlined text-danger"><i class="fas fa-pause"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <img src="../assets/images/img_24.webp" class="rounded-3" width="45" height="45" style="object-fit: cover;">
                                <div>
                                    <h6 class="fw-bold mb-0 text-dark">Swiss Alps Expedition</h6>
                                    <small class="text-muted">ID: TR-8993</small>
                                </div>
                            </div>
                        </td>
                        <td><span class="text-dark fw-medium">Europe</span></td>
                        <td><span class="text-emerald fw-bold">$2,450</span></td>
                        <td>10 Days</td>
                        <td><span class="badge badge-active rounded-pill px-3">Active</span></td>
                        <td class="text-end">
                            <button class="btn btn-sm custom-btn custom-btn-outlined text-primary me-1"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm custom-btn custom-btn-outlined text-danger"><i class="fas fa-pause"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <img src="../assets/images/img_25.webp" class="rounded-3" width="45" height="45" style="object-fit: cover;">
                                <div>
                                    <h6 class="fw-bold mb-0 text-dark">Paris Getaway</h6>
                                    <small class="text-muted">ID: TR-8994</small>
                                </div>
                            </div>
                        </td>
                        <td><span class="text-dark fw-medium">Europe</span></td>
                        <td><span class="text-emerald fw-bold">$890</span></td>
                        <td>5 Days</td>
                        <td><span class="badge badge-neutral rounded-pill px-3">Draft</span></td>
                        <td class="text-end">
                            <button class="btn btn-sm custom-btn custom-btn-outlined text-primary me-1"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm custom-btn custom-btn-outlined text-success"><i class="fas fa-play"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
</body>
</html>
